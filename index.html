<style>
:root{
  --bg:#0e1013; --side:#121418; --bar:#0b0d10; --line:#1f232a; --hover:#1a1e25; --sel:#1d2633;
  --text:#c8ccd4; --dim:#6b7380; --faint:#3a404b;
  --accent:#7aa2f7; --stfg:#0b0d10; --kw:#c49bf0; --str:#9ece6a; --num:#ff9e64; --prop:#7dcfff; --com:#565f6e; --head:#7aa2f7;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#fbfbfa; --side:#f3f3f1; --bar:#ebebe8; --line:#e2e2de; --hover:#e9e9e5; --sel:#dde6f5;
    --text:#2b2f36; --dim:#7a808a; --faint:#c3c6cb;
    --accent:#2f5fd0; --stfg:#fff; --kw:#8a3fc7; --str:#3f7d1c; --num:#b5520f; --prop:#0b7285; --com:#9aa0a8; --head:#2f5fd0;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:13.5px/1.65 var(--mono);-webkit-font-smoothing:antialiased;overflow:hidden}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
::selection{background:var(--sel)}

.app{display:grid;grid-template-rows:34px 1fr 24px;height:100vh;height:100dvh}

/* title bar */
.title{display:flex;align-items:center;gap:12px;padding:0 12px;background:var(--bar);border-bottom:1px solid var(--line);color:var(--dim);font-size:12px;user-select:none}
.dots{display:flex;gap:7px}
.dots i{width:11px;height:11px;border-radius:50%;background:var(--faint);display:block}
.title .name{flex:1;text-align:center}
.title .name b{color:var(--text);font-weight:500}
.menu-btn{display:none;padding:2px 8px;border:1px solid var(--line);border-radius:4px}
.search-btn{padding:2px 10px;border:1px solid var(--line);border-radius:4px;color:var(--dim)}
.search-btn:hover,.menu-btn:hover{color:var(--text);border-color:var(--faint)}

/* main */
.main{display:grid;grid-template-columns:260px 1fr;min-height:0}
.side{background:var(--side);border-right:1px solid var(--line);overflow-y:auto;padding:10px 0;user-select:none}
.side h2{font-size:11px;font-weight:500;letter-spacing:.08em;color:var(--dim);padding:0 16px 8px;text-transform:uppercase}
.tree{list-style:none}
.tree .row{display:flex;align-items:center;gap:8px;width:100%;padding:2px 16px;text-align:left;color:var(--text);white-space:nowrap}
.tree .row:hover{background:var(--hover)}
.tree .row.active{background:var(--sel)}
.tree .dir{color:var(--text)}
.tree .dir .chev{display:inline-block;width:10px;color:var(--dim);transition:transform .15s}
.tree .dir.closed .chev{transform:rotate(-90deg)}
.tree .indent{padding-left:34px}
.tree .indent2{padding-left:52px}
.tree .closed + ul{display:none}
.ic{font-size:9.5px;font-weight:700;width:26px;text-align:center;flex:none;letter-spacing:-.02em}
.ic.md{color:var(--prop)} .ic.sv{color:var(--kw)} .ic.cpp{color:var(--accent)} .ic.c{color:var(--accent)}
.ic.json{color:var(--num)} .ic.log{color:var(--str)} .ic.pdf{color:#e06c75} .ic.ext{color:var(--dim)}
.side .sep{height:1px;background:var(--line);margin:12px 16px}
.side .outline{padding:0 16px;color:var(--dim);font-size:12px}
.side .outline a{display:block;text-decoration:none;padding:1px 0}
.side .outline a:hover{color:var(--text)}

.editor{display:grid;grid-template-rows:35px 26px 1fr;min-width:0;min-height:0}
.tabs{display:flex;background:var(--side);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:6px;padding:0 6px 0 12px;border-right:1px solid var(--line);color:var(--dim);white-space:nowrap;font-size:12.5px;position:relative}
.tab.active{background:var(--bg);color:var(--text)}
.tab.active::after{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--accent)}
.tab .x{width:18px;height:18px;border-radius:3px;color:var(--dim);opacity:0;line-height:18px;text-align:center}
.tab:hover .x,.tab.active .x{opacity:1}
.tab .x:hover{background:var(--hover);color:var(--text)}
.crumbs{padding:0 18px;color:var(--dim);font-size:12px;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden}
.crumbs b{color:var(--text);font-weight:400}

.code{overflow:auto;padding:4px 0 80px;counter-reset:ln}
.l{display:grid;grid-template-columns:56px minmax(0,1fr);min-height:1.65em;counter-increment:ln}
.l::before{content:counter(ln);color:var(--faint);text-align:right;padding-right:22px;user-select:none;font-size:12px;line-height:inherit}
.l > span.t{white-space:pre-wrap;word-break:break-word;max-width:86ch;padding-right:24px}
.l:hover::before{color:var(--dim)}
.l.p > span.t{color:var(--text)}
.c{color:var(--com)} .k{color:var(--kw)} .s{color:var(--str)} .n{color:var(--num)} .pr{color:var(--prop)} .h{color:var(--head);font-weight:700} .d{color:var(--dim)}
.h1{font-size:1.5em;line-height:1.4}
.logd{display:block;padding-left:28ch;color:var(--dim)}
.code a{color:var(--str);text-decoration:none;border-bottom:1px dotted currentColor}
.code a:hover{border-bottom-style:solid}
.cursor{display:inline-block;width:.6em;height:1.15em;vertical-align:-.2em;background:var(--accent);animation:blink 1.1s steps(1) infinite;margin-left:2px}
@keyframes blink{50%{opacity:0}}
.embed{position:relative;width:min(560px,100%);aspect-ratio:16/9;margin:6px 0;border:1px solid var(--line);border-radius:4px;overflow:hidden;background:var(--side)}
.embed iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.empty{display:grid;place-items:center;height:100%;color:var(--dim);text-align:center;line-height:2.2}
.empty kbd{border:1px solid var(--line);border-radius:3px;padding:1px 6px;font:inherit;color:var(--text)}

/* status bar */
.status{display:flex;align-items:center;gap:16px;padding:0 12px;background:var(--accent);color:var(--stfg);font-size:11.5px;white-space:nowrap;overflow:hidden;user-select:none}
.status .grow{flex:1}
.status a{text-decoration:none}
.status .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#1f7a3a;margin-right:6px;vertical-align:0}

/* quick open */
.qo{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;justify-content:center;align-items:flex-start;padding-top:12vh;z-index:10}
.qo.open{display:flex}
.qo-box{width:min(520px,92vw);background:var(--side);border:1px solid var(--line);border-radius:6px;box-shadow:0 18px 50px rgba(0,0,0,.35);overflow:hidden}
.qo input{width:100%;padding:12px 14px;background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--text);font:inherit;outline:none}
.qo ul{list-style:none;max-height:50vh;overflow:auto;padding:4px 0}
.qo li{display:flex;gap:10px;align-items:center;padding:5px 14px;cursor:pointer}
.qo li .d{margin-left:auto;font-size:12px}
.qo li.on{background:var(--sel)}

@media (max-width:760px){
  body{font-size:13px}
  .main{grid-template-columns:1fr}
  .side{position:fixed;top:34px;bottom:24px;left:0;width:260px;z-index:5;transform:translateX(-100%);transition:transform .2s;box-shadow:8px 0 30px rgba(0,0,0,.25)}
  .side.open{transform:none}
  .menu-btn{display:block}

  .l{grid-template-columns:38px minmax(0,1fr)}

@media (prefers-reduced-motion:reduce){.cursor{animation:none}}

/* ---------- tiny syntax helpers ---------- */
const c  = t => `<span class="c">${t}</span>`;
const k  = t => `<span class="k">${t}</span>`;
const s  = t => `<span class="s">${t}</span>`;
const n  = t => `<span class="n">${t}</span>`;
const pr = t => `<span class="pr">${t}</span>`;
const d  = t => `<span class="d">${t}</span>`;
const a  = (href, text) => `<a href="${href}" target="_blank" rel="noopener">${text || href.replace(/^https?:\/\/(www\.)?/,'')}</a>`;
const P  = t => ({p:true, t});            // prose line
const B  = '';                            // blank line

/* C-family project file template */
function project({title, stack, role, what, part, results, links, extra}){
  const L = [];
  L.push(c('/**'));
  L.push(c(' * ') + `<span class="h">${title}</span>`);
  L.push(c(' * ' + stack));
  L.push(c(' * ' + role));
  L.push(c(' */'));
  L.push(B);
  L.push(c('// what it is'));
  what.forEach(t => L.push(P(t)));
  L.push(B);
  if (part){
    L.push(c('// my part'));
    part.forEach(t => L.push(P(d('- ') + t)));
    L.push(B);
  }
  L.push(k('const') + ' results = {');
  Object.entries(results).forEach(([key,val]) => L.push('  ' + pr(key) + ': ' + s(`"${val}"`) + ','));
  L.push('};');
  if (extra) { L.push(B); extra.forEach(x => L.push(x)); }
  if (links && links.length){
    L.push(B);
    links.forEach(([href,label]) => L.push(k('#include') + ' ' + s('&lt;' + a(href,label) + '&gt;')));
  }
  return L;
}

    '  ' + pr('"github"') + ': ' + s('"' + a('https://github.com/aryanja','github.com/aryanja') + '"') + ',',
    '  ' + pr('"linkedin"') + ': ' + s('"' + a('https://www.linkedin.com/in/aryanjain31031014','linkedin.com/in/aryanjain31031014') + '"') + ',',
    '  ' + pr('"resume"') + ': ' + s('"' + a('Aryan_Resume.pdf','Aryan_Resume.pdf') + '"') + ',',
    '  ' + pr('"based_in"') + ': ' + s('"London, UK"') + ',',
    '  ' + pr('"open_to"') + ': [' + s('"hardware"') + ', ' + s('"FPGA"') + ', ' + s('"computer architecture"') + ']',
    '}',
  ]
},
];
const EXTERNAL = [{name:'resume.pdf', ic:'pdf', icon:'PDF', href:'Aryan_Resume.pdf'}];

/* ---------- state ---------- */
const byId = Object.fromEntries(FILES.map(f => [f.id, f]));
let open = [];
let active = null;

const $ = id => document.getElementById(id);
const tree = $('tree'), tabs = $('tabs'), code = $('code'), crumbs = $('crumbs');

/* ---------- explorer ---------- */
function fileRow(f, cls){
  return `<li><button class="row ${cls}" data-id="${f.id}"><span class="ic ${f.ic}">${f.icon}</span>${f.name}</button></li>`;
}
function buildTree(){
  const root = FILES.filter(f => !f.dir);
  const proj = FILES.filter(f => f.dir === 'projects');
  tree.innerHTML = `
    <li><button class="row dir" data-dir="root"><span class="chev">▾</span>aryan-jain</button>
      <ul class="tree">
        ${fileRow(root[0],'indent')}
        ${fileRow(root[1],'indent')}
        <li><button class="row dir indent" data-dir="projects"><span class="chev">▾</span>projects</button>
          <ul class="tree">${proj.map(f => fileRow(f,'indent2')).join('')}</ul>
        </li>
        ${root.slice(2).map(f => fileRow(f,'indent')).join('')}
        ${EXTERNAL.map(e => `<li><a class="row indent" href="${e.href}" target="_blank" rel="noopener" style="text-decoration:none"><span class="ic ${e.ic}">${e.icon}</span>${e.name}<span class="d" style="margin-left:auto">↗</span></a></li>`).join('')}
      </ul>
    </li>`;
}
tree.addEventListener('click', e => {
  const b = e.target.closest('button.row'); if (!b) return;
  if (b.dataset.dir){ b.classList.toggle('closed'); return; }
  openFile(b.dataset.id);
  $('side').classList.remove('open');
});

/* ---------- tabs + editor ---------- */
function openFile(id, push = true){
  if (!byId[id]) id = 'readme';
  if (!open.includes(id)) open.push(id);
  active = id;
  render();
  code.scrollTop = 0;
  if (push && location.hash !== '#' + id) history.replaceState(null, '', '#' + id);
}
function closeFile(id){
  const i = open.indexOf(id);
  open.splice(i, 1);
  if (active === id) active = open[Math.min(i, open.length - 1)] || null;
  render();
  history.replaceState(null, '', active ? '#' + active : location.pathname);
}
function render(){
  tabs.innerHTML = open.map(id => {
    const f = byId[id];
    return `<div class="tab ${id===active?'active':''}" role="tab" data-id="${id}"><button class="open-tab" data-id="${id}" style="display:flex;gap:6px;align-items:center"><span class="ic ${f.ic}">${f.icon}</span>${f.name}</button><button class="x" data-close="${id}" aria-label="Close ${f.name}">×</button></div>`;
  }).join('');
  document.querySelectorAll('.tree .row[data-id]').forEach(r => r.classList.toggle('active', r.dataset.id === active));

  if (!active){
    crumbs.innerHTML = '';
    code.innerHTML = `<div class="empty"><div>No file open.<br>Pick one from the explorer, or press <kbd>⌘P</kbd>.</div></div>`;
    $('stLang').textContent = ''; $('stLines').textContent = '';
    document.title = 'Aryan Jain · Hardware Engineer';
    return;
  }
  const f = byId[active];
  crumbs.innerHTML = ['aryan-jain', f.dir, `<b>${f.name}</b>`].filter(Boolean).join(' <span>›</span> ');
  code.innerHTML = f.lines.map(line => {
    const isP = typeof line === 'object';
    const html = isP ? line.t : line;
    return `<div class="l${isP?' p':''}"><span class="t">${html || ' '}</span></div>`;
  }).join('');
  $('stLang').textContent = f.lang;
  $('stLines').textContent = `${f.lines.length} lines`;
  document.title = `${f.name} · Aryan Jain`;
}
tabs.addEventListener('click', e => {
  const x = e.target.closest('[data-close]');
  if (x){ closeFile(x.dataset.close); return; }
  const t = e.target.closest('[data-id]');
  if (t) openFile(t.dataset.id);
});
tabs.addEventListener('auxclick', e => {           // middle-click closes, like an editor
  const t = e.target.closest('.tab'); if (t && e.button === 1) closeFile(t.dataset.id);
});
code.addEventListener('click', e => {
  const l = e.target.closest('a[data-open]');
  if (l){ e.preventDefault(); openFile(l.dataset.open); }
});

/* ---------- quick open (⌘P / Ctrl+P / "/") ---------- */
const qo = $('qo'), qoInput = $('qoInput'), qoList = $('qoList');
let qoItems = [], qoSel = 0;
function qoRender(){
  const q = qoInput.value.toLowerCase().trim();
  qoItems = FILES.filter(f => (f.name + ' ' + (f.dir||'')).toLowerCase().includes(q));
  qoSel = Math.min(qoSel, Math.max(qoItems.length - 1, 0));
  qoList.innerHTML = qoItems.map((f,i) => `<li class="${i===qoSel?'on':''}" data-id="${f.id}"><span class="ic ${f.ic}">${f.icon}</span>${f.name}<span class="d">${f.dir||''}</span></li>`).join('')
    || `<li class="d">no matching files</li>`;
}
function qoOpen(){ qo.classList.add('open'); qoInput.value=''; qoSel=0; qoRender(); qoInput.focus(); }
function qoClose(){ qo.classList.remove('open'); }
$('searchBtn').onclick = qoOpen;
qo.addEventListener('click', e => {
  const li = e.target.closest('li[data-id]');
  if (li){ openFile(li.dataset.id); qoClose(); }
  else if (e.target === qo) qoClose();
});
qoInput.addEventListener('input', () => { qoSel = 0; qoRender(); });
qoInput.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown'){ qoSel = Math.min(qoSel+1, qoItems.length-1); qoRender(); e.preventDefault(); }
  if (e.key === 'ArrowUp'){ qoSel = Math.max(qoSel-1, 0); qoRender(); e.preventDefault(); }
  if (e.key === 'Enter' && qoItems[qoSel]){ openFile(qoItems[qoSel].id); qoClose(); }
  if (e.key === 'Escape') qoClose();
});
document.addEventListener('keydown', e => {
  const typing = /input|textarea/i.test(document.activeElement.tagName);
  if (((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'p') || (e.key === '/' && !typing)){
    e.preventDefault(); qo.classList.contains('open') ? qoClose() : qoOpen();
  }
  if (e.key === 'Escape') { qoClose(); $('side').classList.remove('open'); }
});
if (!/Mac|iPhone|iPad/.test(navigator.platform)) $('searchBtn').textContent = 'Ctrl+P';

/* ---------- mobile explorer ---------- */
$('menuBtn').onclick = () => $('side').classList.toggle('open');

/* ---------- boot ---------- */
buildTree();
const start = location.hash.slice(1);
open = ['readme'];
if (start && byId[start] && start !== 'readme') openFile(start, false); else openFile('readme', false);
window.addEventListener('hashchange', () => openFile(location.hash.slice(1), false));
</script>
</body>
</html>
